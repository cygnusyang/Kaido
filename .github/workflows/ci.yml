# Kairo CI：Linux 构建门禁（风险 R1 缓解，ADR-004 可移植性验证）
# 选型：官方 swift:6.0-jammy 容器镜像（ADR 记录于 docs/02-architecture.md §7 第 2 条）——
# 镜像自带完整 Linux 工具链，避免 setup-swift action 的版本漂移。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-core:
    name: Linux 核心构建与测试
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: 核心边界门禁（ADR-004：KairoCore 零 UI 依赖）
        run: ./tools/gate-core.sh

      - name: 构建
        run: swift build

      - name: 测试
        run: swift test
