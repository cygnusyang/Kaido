# Kairo Linux CI（G3 判据 4：核心在 Linux 编译并通过全量单测）
#
# 选型：swift-actions/setup-swift 而非 swift:6.0-jammy Docker 容器（二选一）。
# 理由：setup-swift 直接安装 Swift.org 官方二进制工具链，无需容器默认用户/
# 工作目录/网络约定，GitHub 托管运行器缓存更友好、启动更快；KairoCore 仅依赖
# Foundation 子集（ADR-004），无系统包需求，不引入容器层。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Gate — KairoCore 零 UI 依赖（ADR-004）
        run: bash tools/gate-core.sh
