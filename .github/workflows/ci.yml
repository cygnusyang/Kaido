name: ci

# push / PR 触发；发版路径由 release.yml 负责，这里不重复。
on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: test · macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode（Swift Testing 需要 16+）
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 工具链版本
        run: swift --version

      - name: 缓存 .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-

      - name: 测试
        run: swift test

      - name: 门禁 · 核心层不得依赖 UI 框架（ADR-004 / ADR-013）
        run: bash tools/gate-core.sh

      - name: 门禁 · 视图层不得直接引用核心模型（ADR-013）
        run: bash tools/gate-ui.sh

      - name: 门禁 · 脚本变量不得紧跟全角字符（bash 3.2 会把全角并入变量名，#7）
        run: bash tools/check-shell-fullwidth.sh

      - name: 门禁 · 多语言（零硬编码中文 / 无 Bundle.module / 键完整 / 白名单为空）
        run: |
          set -euo pipefail
          CATALOG="Apps/macos/Resources/Localizable.xcstrings"
          if [[ ! -f "$CATALOG" ]]; then
            echo "::error title=i18n::缺少 $CATALOG —— 键完整性无法校验。F-0705（视图接入 Catalog）未合入前本步骤保持红色，这是门禁的预期行为，不要加跳过开关。"
            exit 1
          fi
          bash tools/i18n-compile.sh "$RUNNER_TEMP/kairo-lproj"
          bash tools/i18n-lint.sh --require-catalog --fail-if-whitelist-nonempty --lproj-dir "$RUNNER_TEMP/kairo-lproj"

      - name: 自测 · 多语言门禁自身（用例只增不减）
        run: bash tools/i18n-lint-selftest.sh

  linux:
    name: test · Linux（核心与接口层）
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本
        run: swift --version

      - name: 缓存 .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-

      - name: 门禁 · 核心层不得依赖 UI 框架（ADR-004）
        run: bash tools/gate-core.sh

      - name: 测试（App / GUI target 在 Linux 不参与构建）
        run: swift test
