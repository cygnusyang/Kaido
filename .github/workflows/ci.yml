name: ci

# push / PR 触发；发版路径由 release.yml 负责，这里不重复。
on:
  push:
    branches: [main]
    tags-ignore: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: test · macOS
    # 固定到与本机一致的 Xcode：本机 Xcode 27.2（27B52）= Swift 6.4.2。
    # 此前用 macos-14 + latest-stable，实际落在 Swift 6.0.3，导致「本机能编、CI 编不过」两次返工；
    # v1.5.0 又遇到反向情况——本机 27.2 绿、CI 26.4.1 红（入口视图在旧 SDK 下不渲染），
    # 因此跟随本机升到 27.2。若 runner 镜像尚未提供 27.2，本步会直接失败在 setup-xcode，属预期。
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode（固定版本，不要 latest-stable）
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6'

      - name: 工具链版本
        run: swift --version

      - name: 校验工具链版本（防 runner 镜像漂移）
        shell: bash
        run: |
          set -euo pipefail
          PINNED="6.3"
          ACTUAL="$(swift --version | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          echo "pinned=${PINNED} actual=${ACTUAL}"
          if [ "${ACTUAL%.*}" != "${PINNED}" ]; then
            echo "::error::CI 工具链 ${ACTUAL} 与本地 ${PINNED} 不一致（runner 镜像可能已漂移）。要么把本工作流的镜像/Xcode 固定回与本地一致，要么显式升级 PINNED 并在本机同步升级 Swift。v1.0.0 与 v1.1.0 各因这一漂移在发版门禁上红过一次。"
            exit 1
          fi

      - name: 缓存 .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-

      # 告警一律视为失败，与 tools/build.sh（发版构建）同一口径，避免带 warning 的代码
      # 只在发版 job 里才变红。作用范围是**产出目标**（不含 test target）：
      # 测试代码的 unused 提示（如 `try #require` 返回值未使用）不应成为发布门禁。
      - name: 编译（warnings-as-errors）
        run: swift build -Xswiftc -warnings-as-errors

      # 限并发：runner 只有 3 vCPU，1701 个用例同时起步时，OTA 那批「绝对墙钟」断言
      # （OTAInstallGuardTests 的 <1.5s、OTAHygieneTests 的 2s 超时）与性能预算会因排队而假红，
      # 与代码无关。--num-workers 2 把并行度压到 CPU 数以下，代价是本步慢几十秒。
      - name: 测试
        run: bash tools/test.sh --scratch-path /tmp/kaido-ci-tests --parallel --num-workers 2

      - name: 门禁 · 核心层不得依赖 UI 框架（ADR-004 / ADR-013）
        run: bash tools/gate-core.sh

      - name: 门禁 · 视图层不得直接引用核心模型（ADR-013）
        run: bash tools/gate-ui.sh

      - name: 门禁 · 脚本变量不得紧跟全角字符（bash 3.2 会把全角并入变量名，#7）
        run: bash tools/check-shell-fullwidth.sh

      # 与 release.yml 共用 tools/gate-i18n.sh：发版门禁口径必须等于合入前口径。
      - name: 门禁 · 多语言（硬编码中文 / Bundle.module / 键完整性）
        run: |
          set -euo pipefail
          CATALOG="Apps/macos/Resources/Localizable.xcstrings"
          if [[ ! -f "$CATALOG" ]]; then
            echo "::error title=i18n::缺少 $CATALOG —— 键完整性无法校验。F-0705（视图接入 Catalog）未合入前本步骤保持红色，这是门禁的预期行为，不要加跳过开关。"
            exit 1
          fi
          bash tools/i18n-compile.sh "$RUNNER_TEMP/kaido-lproj"
          bash tools/i18n-lint.sh --require-catalog --lproj-dir "$RUNNER_TEMP/kaido-lproj"

      - name: 自测 · 多语言门禁自身（用例只增不减）
        run: bash tools/i18n-lint-selftest.sh

  linux:
    name: test · Linux（核心与接口层）
    runs-on: ubuntu-latest
    # 与 macOS 作业同一语言版本（6.3.1），避免「Linux 能编、macOS 不能」这类跨端差异。
    container: swift:6.3.1-jammy
    steps:
      - uses: actions/checkout@v4

      - name: 工具链版本
        run: swift --version

      - name: 校验工具链版本（防 runner 镜像漂移）
        shell: bash
        run: |
          set -euo pipefail
          PINNED="6.3.1"
          ACTUAL="$(swift --version | sed -n 's/.*Swift version \([0-9][0-9.]*\).*/\1/p' | head -1)"
          echo "pinned=${PINNED} actual=${ACTUAL}"
          if [ "${ACTUAL}" != "${PINNED}" ]; then
            echo "::error::CI 工具链 ${ACTUAL} 与本地 ${PINNED} 不一致（runner 镜像可能已漂移）。要么把本工作流的镜像/Xcode 固定回与本地一致，要么显式升级 PINNED 并在本机同步升级 Swift。v1.0.0 与 v1.1.0 各因这一漂移在发版门禁上红过一次。"
            exit 1
          fi

      - name: 缓存 .build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-

      - name: 门禁 · 核心层不得依赖 UI 框架（ADR-004）
        run: bash tools/gate-core.sh

      # 告警口径与 macOS 侧一致：对产出目标开 warnings-as-errors（此前 Linux 完全没开，
      # Linux 专属代码带 warning 也不会被发现）。
      - name: 编译（warnings-as-errors）
        run: swift build -Xswiftc -warnings-as-errors

      # 测试集差异是设计使然（Package.swift 的 #if os(macOS)）：Linux 只有
      # KaidoCoreTests / KaidoPresentationTests / InterfaceTests；AppTests 与
      # KaidoUpdaterTests（Security/CryptoKit）只在 macOS 跑。
      - name: 测试（App / GUI target 在 Linux 不参与构建）
        run: swift test
