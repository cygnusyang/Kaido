name: release

# tag 推送触发：编译、测试、打包 Kairo.app 并发布 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode 16+（Swift Testing 需要）
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 检出 Swift 版本
        run: swift --version

      - name: 测试
        run: swift test

      - name: 编译打包
        run: bash tools/build.sh

      - name: 打包 DMG（打开拖入 Applications，替代 zip）
        run: |
          # GitHub Release 附件只能是单文件，.app 是目录传不了；
          # DMG 内放 App + /Applications 软链，挂载后直接拖拽安装。
          STAGING="$(mktemp -d)/dmg-staging"
          mkdir -p "$STAGING"
          cp -R dist/Kairo.app "$STAGING/Kairo.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "Kairo ${GITHUB_REF_NAME}" \
            -srcfolder "$STAGING" -ov -format UDZO \
            "Kairo-${GITHUB_REF_NAME}.dmg"

      - name: 提取本版本 changelog
        id: changelog
        run: |
          # 章节标题形如「## v0.1.0 — 2026-10-18」，按前缀匹配。
          TAG="${GITHUB_REF_NAME}"
          if [ -f CHANGELOG.md ]; then
            awk -v t="$TAG" '
              index($0, "## " t) == 1 { found=1; next }
              /^## / && found { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            # 无对应章节时回退：说明 + GitHub 自动生成的提交列表。
            echo "（CHANGELOG.md 中没有「## $TAG」章节，以下为自动生成的提交列表。）" > release-notes.md
            echo "has_autonotes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.changelog.outputs.has_autonotes }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" "Kairo-${GITHUB_REF_NAME}.dmg" \
              --title "Kairo ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" "Kairo-${GITHUB_REF_NAME}.dmg" \
              --title "Kairo ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
