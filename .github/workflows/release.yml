name: release

# tag 推送触发：编译、测试、打包 Kairo.app 并发布 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      # 有 Developer ID 证书即启用签名与公证；缺省时整段跳过，发布照常进行（未签名）。
      SIGNING_ENABLED: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode 16+（Swift Testing 需要）
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 检出 Swift 版本
        run: swift --version

      - name: 测试
        run: swift test

      - name: 编译打包
        run: bash tools/build.sh

      - name: 导入 Developer ID 证书
        if: env.SIGNING_ENABLED == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN=build.keychain
          security create-keychain -p actions "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p actions "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$KEYCHAIN"
          rm -f cert.p12
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application[^"]*\)".*/\1/p' | head -1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "ERROR: 未在 p12 中找到 Developer ID Application 证书" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: 签名应用（Hardened Runtime）
        if: env.SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          codesign --force --deep --options runtime --timestamp \
            --sign "$SIGN_IDENTITY" dist/Kairo.app
          codesign --verify --deep --strict --verbose=2 dist/Kairo.app

      - name: 打包发布产物（DMG + OTA 载体 zip）
        run: |
          # 与本地 tools/release.sh 同源：一次产出 DMG（人装）与 zip（OTA 载体），
          # 并校验应用内版本号等于 tag，避免把旧版本装进新版本的附件。
          bash tools/package.sh "${GITHUB_REF_NAME}" --skip-build --out .
          echo "ZIP_SHA256=$(shasum -a 256 "Kairo-${GITHUB_REF_NAME}.zip" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: 公证 DMG（notarytool）
        if: env.SIGNING_ENABLED == 'true'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -euo pipefail
          DMG="Kairo-${GITHUB_REF_NAME}.dmg"
          codesign --force --sign "$SIGN_IDENTITY" --timestamp "$DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: 构建 CLI / MCP 通用二进制（一行安装用）
        run: |
          set -euo pipefail
          # 双架构通用二进制：Intel 与 Apple Silicon 共用一份产物
          for p in KairoCLI KairoMCP; do
            swift build -c release --arch arm64 --arch x86_64 --product "$p"
          done
          BIN=".build/apple/Products/Release"
          STAGE="kairo-${GITHUB_REF_NAME}-macos-universal"
          rm -rf "$STAGE" "$STAGE.tar.gz"
          mkdir -p "$STAGE/bin"
          cp "$BIN/KairoCLI" "$STAGE/bin/kairo"
          cp "$BIN/KairoMCP" "$STAGE/bin/kairo-mcp"
          chmod +x "$STAGE"/bin/*
          tar -czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" | awk '{print $1}' > "$STAGE.tar.gz.sha256"
          echo "CLI_TARBALL=$STAGE.tar.gz" >> "$GITHUB_ENV"
          ls -lh "$STAGE.tar.gz"

      - name: 签名更新清单（update-manifest.json）
        env:
          UPDATE_SIGNING_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}
          OTA_MINIMUM_VERSION: "0.2.0"   # 防降级地板，只增不减（人工复核）
        run: |
          # 私钥 secret 存在校验（缺失即 fail，禁止未签名清单上架）
          if [ -z "$UPDATE_SIGNING_KEY_BASE64" ]; then
            echo "ERROR: 缺少 secret UPDATE_SIGNING_KEY_BASE64（Ed25519 私钥）" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CDHASH="$(tools/extract_cdhash.sh)"
          UPDATE_SIGNING_KEY_BASE64="$UPDATE_SIGNING_KEY_BASE64" \
            MF_VERSION="$VERSION" \
            MF_MINIMUM_VERSION="$OTA_MINIMUM_VERSION" \
            MF_BUILD_TIME="$BUILD_TIME" \
            MF_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Kairo-${GITHUB_REF_NAME}.zip" \
            MF_CDHASH="$CDHASH" \
            MF_SHA256="$ZIP_SHA256" \
            tools/sign_update_manifest.sh > update-manifest.json
          # 公钥门禁：从 App 源码常量提取公钥（单一事实源）复验签名——
          # 私钥与硬编码公钥不配对 / 清单被篡改都会在此拦截。
          PUBLIC_KEY="$(grep -o 'updatePublicKeyBase64 = "[^"]*"' \
            Apps/macos/Sources/Updater/UpdaterConfiguration.swift | sed 's/.*"\(.*\)"/\1/')"
          swift tools/verify_update_manifest.swift update-manifest.json "$PUBLIC_KEY"

      - name: 提取本版本 changelog
        id: changelog
        run: |
          # 说明的唯一来源是 CHANGELOG.md（与本地 tools/release.sh 同源抽取）。
          if bash tools/release_notes.sh "${GITHUB_REF_NAME}" > release-notes.md 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            # 章节缺失时回退：说明 + GitHub 自动生成的提交列表。
            echo "（CHANGELOG.md 中没有「## ${GITHUB_REF_NAME}」章节，以下为自动生成的提交列表。）" > release-notes.md
            echo "has_autonotes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 归档产物到 artifacts 分支（仓库内可追溯）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 产物按 tag 子目录归档 + latest/ 镜像，提交到专用 artifacts 分支
          #（主分支保持干净，不受 *.dmg/zip gitignore 影响——此处强制添加）。
          TAG="${GITHUB_REF_NAME}"
          git config user.name "kairo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          # 大文件在慢链路上易被 408/断连打断（D-026）：抬高缓冲区并放宽低速判定，
          # 推送失败时整体重推（提交已生成，重试不产生新提交）。
          git config http.postBuffer 524288000
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 60
          if git fetch origin artifacts --depth 1 2>/dev/null; then
            git checkout -B artifacts origin/artifacts
          else
            git checkout --orphan artifacts
            # 只清索引不清工作区——后续步骤的产物文件（zip/dmg/manifest）还在
            # 磁盘上；orphan 提交只包含下方显式 git add 的内容。
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          # latest/ 每次重建：只镜像当前版本，不残留历史产物（D-026）。
          rm -rf "$TAG" latest
          mkdir -p "$TAG" latest
          cp "Kairo-${TAG}.dmg" "Kairo-${TAG}.zip" update-manifest.json "$TAG"/
          cp "Kairo-${TAG}.dmg" "Kairo-${TAG}.zip" update-manifest.json latest/
          git add -Af "$TAG" latest
          if ! git diff --cached --quiet; then
            git commit -m "artifacts: ${TAG}（DMG + OTA 载体 zip + 签名清单）"
          fi
          for attempt in 1 2 3; do
            if git push origin artifacts; then
              echo "artifacts 推送成功（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "artifacts 推送第 ${attempt} 次失败，10 秒后重试" >&2
            sleep 10
          done
          echo "ERROR: artifacts 推送连续 3 次失败" >&2
          exit 1

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 附件：DMG（人装）+ zip（OTA 载体）+ update-manifest.json（OTA feed，
          # /releases/latest/download/ 永久链接随每个 release 重传即更新）
          if [ "${{ steps.changelog.outputs.has_autonotes }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              "Kairo-${GITHUB_REF_NAME}.dmg" "Kairo-${GITHUB_REF_NAME}.zip" update-manifest.json \
              "$CLI_TARBALL" "$CLI_TARBALL.sha256" \
              --title "Kairo ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              "Kairo-${GITHUB_REF_NAME}.dmg" "Kairo-${GITHUB_REF_NAME}.zip" update-manifest.json \
              "$CLI_TARBALL" "$CLI_TARBALL.sha256" \
              --title "Kairo ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
