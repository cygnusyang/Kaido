name: release

# tag 推送触发：编译、测试、打包 Kairo.app 并发布 GitHub Release。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 选择 Xcode 16+（Swift Testing 需要）
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: 检出 Swift 版本
        run: swift --version

      - name: 测试
        run: swift test

      - name: 编译打包
        run: bash tools/build.sh

      - name: 打包发布产物（DMG + OTA 载体 zip）
        run: |
          # 与本地 tools/release.sh 同源：一次产出 DMG（人装）与 zip（OTA 载体），
          # 并校验应用内版本号等于 tag，避免把旧版本装进新版本的附件。
          bash tools/package.sh "${GITHUB_REF_NAME}" --skip-build --out .
          echo "ZIP_SHA256=$(shasum -a 256 "Kairo-${GITHUB_REF_NAME}.zip" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: 签名更新清单（update-manifest.json）
        env:
          UPDATE_SIGNING_KEY_BASE64: ${{ secrets.UPDATE_SIGNING_KEY_BASE64 }}
          OTA_MINIMUM_VERSION: "0.2.0"   # 防降级地板，只增不减（人工复核）
        run: |
          # 私钥 secret 存在校验（缺失即 fail，禁止未签名清单上架）
          if [ -z "$UPDATE_SIGNING_KEY_BASE64" ]; then
            echo "ERROR: 缺少 secret UPDATE_SIGNING_KEY_BASE64（Ed25519 私钥）" >&2
            exit 1
          fi
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          CDHASH="$(tools/extract_cdhash.sh)"
          UPDATE_SIGNING_KEY_BASE64="$UPDATE_SIGNING_KEY_BASE64" \
            MF_VERSION="$VERSION" \
            MF_MINIMUM_VERSION="$OTA_MINIMUM_VERSION" \
            MF_BUILD_TIME="$BUILD_TIME" \
            MF_DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/Kairo-${GITHUB_REF_NAME}.zip" \
            MF_CDHASH="$CDHASH" \
            MF_SHA256="$ZIP_SHA256" \
            tools/sign_update_manifest.sh > update-manifest.json
          # 公钥门禁：从 App 源码常量提取公钥（单一事实源）复验签名——
          # 私钥与硬编码公钥不配对 / 清单被篡改都会在此拦截。
          PUBLIC_KEY="$(grep -o 'updatePublicKeyBase64 = "[^"]*"' \
            Apps/macos/Sources/Updater/UpdaterConfiguration.swift | sed 's/.*"\(.*\)"/\1/')"
          swift tools/verify_update_manifest.swift update-manifest.json "$PUBLIC_KEY"

      - name: 提取本版本 changelog
        id: changelog
        run: |
          # 说明的唯一来源是 CHANGELOG.md（与本地 tools/release.sh 同源抽取）。
          if bash tools/release_notes.sh "${GITHUB_REF_NAME}" > release-notes.md 2>/dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            # 章节缺失时回退：说明 + GitHub 自动生成的提交列表。
            echo "（CHANGELOG.md 中没有「## ${GITHUB_REF_NAME}」章节，以下为自动生成的提交列表。）" > release-notes.md
            echo "has_autonotes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 归档产物到 artifacts 分支（仓库内可追溯）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 产物按 tag 子目录归档 + latest/ 镜像，提交到专用 artifacts 分支
          #（主分支保持干净，不受 *.dmg/zip gitignore 影响——此处强制添加）。
          TAG="${GITHUB_REF_NAME}"
          git config user.name "kairo-release-bot"
          git config user.email "actions@users.noreply.github.com"
          # 大文件在慢链路上易被 408/断连打断（D-026）：抬高缓冲区并放宽低速判定，
          # 推送失败时整体重推（提交已生成，重试不产生新提交）。
          git config http.postBuffer 524288000
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 60
          if git fetch origin artifacts --depth 1 2>/dev/null; then
            git checkout -B artifacts origin/artifacts
          else
            git checkout --orphan artifacts
            # 只清索引不清工作区——后续步骤的产物文件（zip/dmg/manifest）还在
            # 磁盘上；orphan 提交只包含下方显式 git add 的内容。
            git rm -rf --cached . >/dev/null 2>&1 || true
          fi
          # latest/ 每次重建：只镜像当前版本，不残留历史产物（D-026）。
          rm -rf "$TAG" latest
          mkdir -p "$TAG" latest
          cp "Kairo-${TAG}.dmg" "Kairo-${TAG}.zip" update-manifest.json "$TAG"/
          cp "Kairo-${TAG}.dmg" "Kairo-${TAG}.zip" update-manifest.json latest/
          git add -Af "$TAG" latest
          if ! git diff --cached --quiet; then
            git commit -m "artifacts: ${TAG}（DMG + OTA 载体 zip + 签名清单）"
          fi
          for attempt in 1 2 3; do
            if git push origin artifacts; then
              echo "artifacts 推送成功（第 ${attempt} 次尝试）"
              exit 0
            fi
            echo "artifacts 推送第 ${attempt} 次失败，10 秒后重试" >&2
            sleep 10
          done
          echo "ERROR: artifacts 推送连续 3 次失败" >&2
          exit 1

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 附件：DMG（人装）+ zip（OTA 载体）+ update-manifest.json（OTA feed，
          # /releases/latest/download/ 永久链接随每个 release 重传即更新）
          if [ "${{ steps.changelog.outputs.has_autonotes }}" = "true" ]; then
            gh release create "$GITHUB_REF_NAME" \
              "Kairo-${GITHUB_REF_NAME}.dmg" "Kairo-${GITHUB_REF_NAME}.zip" update-manifest.json \
              --title "Kairo ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md \
              --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" \
              "Kairo-${GITHUB_REF_NAME}.dmg" "Kairo-${GITHUB_REF_NAME}.zip" update-manifest.json \
              --title "Kairo ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
