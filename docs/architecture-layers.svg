<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 614" width="900" height="614"
     role="img" aria-labelledby="kairo-fig-title kairo-fig-desc">
  <title id="kairo-fig-title">Kairo layered architecture</title>
  <desc id="kairo-fig-desc">Four equivalent interfaces (macOS app, MCP server, CLI, Claude Code plugin) sit on top of KairoPresentation and KairoCommands; the cross-platform core KairoCore (model, scheduler, storage, queries) is at the bottom. Arrows point along the dependency direction.</desc>
  <style>
    .canvas { fill: #FFFFFF; }
    .panel { fill: #FFFFFF; stroke: #D8DAE0; stroke-width: 1; }
    .soft { fill: #F6F7F9; stroke: #D8DAE0; stroke-width: 1; }
    .accent { fill: #EEF0FE; stroke: #5F6CF8; stroke-width: 1; }
    .core { fill: #F4EEFC; stroke: #A13EF2; stroke-width: 1; }
    .line { stroke: #7A8290; stroke-width: 1.3; fill: none; }
    .tree { stroke: #C3C7D0; stroke-width: 1; fill: none; }
    .t-title { font: 600 13px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #1C1C1E; }
    .t-sub { font: 400 12px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; }
    .t-name { font: 600 12.5px "SF Mono", ui-monospace, Menlo, monospace; fill: #1C1C1E; }
    .t-mono { font: 400 12px "SF Mono", ui-monospace, Menlo, monospace; fill: #1C1C1E; }
    .t-band { font: 600 11px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; letter-spacing: 0.4px; }
    .t-note { font: 400 10.5px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; }
    .arrow-head { fill: #7A8290; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1C1C1E; }
      .panel { fill: #2C2C2E; stroke: #3A3A3C; }
      .soft { fill: #242426; stroke: #3A3A3C; }
      .accent { fill: #232640; stroke: #5F6CF8; }
      .core { fill: #2B2233; stroke: #A13EF2; }
      .line { stroke: #8B93A3; }
      .tree { stroke: #4A4A4E; }
      .t-title, .t-name, .t-mono { fill: #F2F2F7; }
      .t-sub, .t-band, .t-note { fill: #A6A6AD; }
      .arrow-head { fill: #8B93A3; }
    }
  </style>
  <defs>
    <marker id="kairo-arrow" markerWidth="8" markerHeight="8" refX="7.2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrow-head"/>
    </marker>
  </defs>
  <rect class="canvas" x="0" y="0" width="900" height="614"/>
  <rect class="soft" x="20" y="20" width="860" height="164" rx="12"/>
  <text class="t-band" x="36" y="44">Equivalent interface layer (same capability)</text>
  <rect class="panel" x="44" y="58" width="180" height="100" rx="8"/>
  <text class="t-title" x="134" y="100" text-anchor="middle">macOS app</text>
  <text class="t-sub" x="134" y="122" text-anchor="middle">SwiftUI</text>
  <rect class="panel" x="240" y="58" width="180" height="100" rx="8"/>
  <text class="t-title" x="330" y="100" text-anchor="middle">MCP server</text>
  <text class="t-sub" x="330" y="122" text-anchor="middle">MCP SDK</text>
  <rect class="panel" x="436" y="58" width="180" height="100" rx="8"/>
  <text class="t-title" x="526" y="100" text-anchor="middle">CLI</text>
  <text class="t-sub" x="526" y="122" text-anchor="middle">kairo cmd</text>
  <rect class="panel" x="632" y="58" width="224" height="100" rx="8"/>
  <text class="t-title" x="744" y="82" text-anchor="middle">Claude Code plugin</text>
  <text class="t-sub" x="744" y="104" text-anchor="middle">slash commands + hooks</text>
  <text class="t-sub" x="744" y="124" text-anchor="middle">+ .mcp.json</text>
  <text class="t-sub" x="744" y="146" text-anchor="middle">(via MCP server / CLI)</text>
  <rect class="accent" x="44" y="222" width="250" height="64" rx="8"/>
  <text class="t-title" x="169" y="248" text-anchor="middle">KairoPresentation</text>
  <text class="t-sub" x="169" y="270" text-anchor="middle">view state → snapshot + actions</text>
  <rect class="accent" x="44" y="326" width="812" height="60" rx="8"/>
  <text class="t-title" x="60" y="352">KairoCommands</text>
  <text class="t-sub" x="60" y="372">KairoSession (single write path); MCP server and CLI share one command semantics</text>
  <path class="line" d="M134,158 L134,222" marker-end="url(#kairo-arrow)"/>
  <path class="line" d="M169,286 L169,326" marker-end="url(#kairo-arrow)"/>
  <path class="line" d="M330,158 L330,326" marker-end="url(#kairo-arrow)"/>
  <path class="line" d="M526,158 L526,326" marker-end="url(#kairo-arrow)"/>
  <path class="line" d="M450,386 L450,420" marker-end="url(#kairo-arrow)"/>
  <rect class="core" x="20" y="420" width="860" height="154" rx="12"/>
  <text class="t-band" x="36" y="444">Cross-platform core KairoCore (pure logic)</text>
  <rect class="panel" x="44" y="456" width="191" height="96" rx="8"/>
  <text class="t-title" x="139" y="492" text-anchor="middle">Data model</text>
  <text class="t-sub" x="139" y="514" text-anchor="middle">Model</text>
  <rect class="panel" x="251" y="456" width="191" height="96" rx="8"/>
  <text class="t-title" x="346" y="492" text-anchor="middle">Scheduler</text>
  <text class="t-sub" x="346" y="514" text-anchor="middle">Schedule</text>
  <rect class="panel" x="458" y="456" width="191" height="96" rx="8"/>
  <text class="t-title" x="553" y="492" text-anchor="middle">Storage</text>
  <text class="t-sub" x="553" y="514" text-anchor="middle">Storage</text>
  <rect class="panel" x="665" y="456" width="191" height="96" rx="8"/>
  <text class="t-title" x="760" y="492" text-anchor="middle">Query</text>
  <text class="t-sub" x="760" y="514" text-anchor="middle">Query</text>
  <text class="t-note" x="20" y="588">Arrows point along the dependency direction (upper depends on lower).</text>
  <text class="t-note" x="20" y="606">KairoCore, KairoCommands, KairoPresentation are Foundation-only (iOS/Linux); the app is the only UI shell, and interface layers are independent.</text>
</svg>
