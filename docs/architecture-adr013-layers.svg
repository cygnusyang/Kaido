<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440"
     role="img" aria-labelledby="kaido-fig-title kaido-fig-desc">
  <title id="kaido-fig-title">ADR-013 presentation layer and single write path</title>
  <desc id="kaido-fig-desc">KaidoMacApp depends on KaidoPresentation, which depends on KaidoCommands, which depends on KaidoCore; KaidoMCP and KaidoCLI reach the core through KaidoCommands.</desc>
  <style>
    .canvas { fill: #FFFFFF; }
    .panel { fill: #FFFFFF; stroke: #D8DAE0; stroke-width: 1; }
    .soft { fill: #F6F7F9; stroke: #D8DAE0; stroke-width: 1; }
    .accent { fill: #EEF0FE; stroke: #5F6CF8; stroke-width: 1; }
    .core { fill: #F4EEFC; stroke: #A13EF2; stroke-width: 1; }
    .line { stroke: #7A8290; stroke-width: 1.3; fill: none; }
    .tree { stroke: #C3C7D0; stroke-width: 1; fill: none; }
    .t-title { font: 600 13px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #1C1C1E; }
    .t-sub { font: 400 12px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; }
    .t-name { font: 600 12.5px "SF Mono", ui-monospace, Menlo, monospace; fill: #1C1C1E; }
    .t-mono { font: 400 12px "SF Mono", ui-monospace, Menlo, monospace; fill: #1C1C1E; }
    .t-band { font: 600 11px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; letter-spacing: 0.4px; }
    .t-note { font: 400 10.5px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; }
    .arrow-head { fill: #7A8290; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1C1C1E; }
      .panel { fill: #2C2C2E; stroke: #3A3A3C; }
      .soft { fill: #242426; stroke: #3A3A3C; }
      .accent { fill: #232640; stroke: #5F6CF8; }
      .core { fill: #2B2233; stroke: #A13EF2; }
      .line { stroke: #8B93A3; }
      .tree { stroke: #4A4A4E; }
      .t-title, .t-name, .t-mono { fill: #F2F2F7; }
      .t-sub, .t-band, .t-note { fill: #A6A6AD; }
      .arrow-head { fill: #8B93A3; }
    }
  </style>
  <defs>
    <marker id="kaido-arrow" markerWidth="8" markerHeight="8" refX="7.2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrow-head"/>
    </marker>
  </defs>
  <rect class="canvas" x="0" y="0" width="880" height="440"/>
  <rect class="accent" x="40" y="26" width="560" height="54" rx="8"/>
  <text class="t-title" x="60" y="49">KaidoMacApp</text>
  <text class="t-sub" x="60" y="68">SwiftUI: WorkspaceStore adapter, shell, drawing and gestures</text>
  <path class="line" d="M320,80 L320,106" marker-end="url(#kaido-arrow)"/>
  <rect class="accent" x="40" y="106" width="560" height="54" rx="8"/>
  <text class="t-title" x="60" y="129">KaidoPresentation</text>
  <text class="t-sub" x="60" y="148">Foundation-only: view state → neutral snapshot + actions</text>
  <path class="line" d="M320,160 L320,186" marker-end="url(#kaido-arrow)"/>
  <rect class="accent" x="40" y="186" width="560" height="54" rx="8"/>
  <text class="t-title" x="60" y="209">KaidoCommands</text>
  <text class="t-sub" x="60" y="228">Foundation-only: KaidoSession (single write path)</text>
  <path class="line" d="M320,240 L320,266" marker-end="url(#kaido-arrow)"/>
  <rect class="core" x="40" y="266" width="560" height="54" rx="8"/>
  <text class="t-title" x="60" y="289">KaidoCore</text>
  <text class="t-sub" x="60" y="308">Foundation-only: model, scheduling, violations, queries, layout geometry</text>
  <rect class="soft" x="640" y="172" width="220" height="84" rx="8"/>
  <text class="t-title" x="656" y="198">KaidoMCP / KaidoCLI</text>
  <text class="t-mono" x="656" y="220">→ KaidoCommands</text>
  <text class="t-mono" x="656" y="240">→ KaidoCore</text>
  <path class="line" d="M640,214 L600,214" marker-end="url(#kaido-arrow)"/>
  <text class="t-note" x="20" y="408">Arrows point at the depended-on layer; dependencies are one-way. KaidoPresentation must not import SwiftUI, AppKit or Combine;</text>
  <text class="t-note" x="20" y="425">the three Foundation-only modules must build on iOS and Linux.</text>
</svg>
