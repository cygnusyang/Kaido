<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="t d">
  <title id="t">Zeno plan workbench — schematic</title>
  <desc id="d">Schematic of the Zeno plan workbench: an outline on the left, a timeline on the right with one bar per outline row, and a task inspector on the far right. A violation banner and the command palette sit below.</desc>
