<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-labelledby="title desc">
  <title id="title">Kaido division of labour</title>
  <desc id="desc">The requirements document is read by the AI and broken down into a WBS; Kaido schedules and tracks it; the AI then builds feature by feature and writes status back, closing the loop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .box-kaido { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .edge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
      .line { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Nodes -->
  <rect class="box" x="20" y="36" width="128" height="48" rx="10"/>
  <text class="label" x="84" y="60">Requirements</text>

  <rect class="box" x="232" y="36" width="128" height="48" rx="10"/>
  <text class="label" x="296" y="60">WBS breakdown</text>

  <rect class="box-kaido" x="444" y="36" width="144" height="48" rx="10"/>
  <text class="label" x="516" y="60">Kaido scheduling</text>

  <rect class="box" x="696" y="36" width="152" height="48" rx="10"/>
  <text class="label" x="772" y="60">AI implementation</text>

  <!-- Forward edges -->
  <path class="line" d="M 148 60 H 224"/>
  <text class="edge" x="186" y="48">read by AI</text>

  <path class="line" d="M 360 60 H 436"/>

  <path class="line" d="M 588 60 H 688"/>

  <!-- Feedback loop -->
  <path class="line" d="M 772 84 V 148 H 84 V 92"/>
  <text class="edge" x="428" y="168">AI writes back status as each task completes</text>
</svg>
