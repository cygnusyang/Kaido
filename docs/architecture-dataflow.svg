<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320"
     role="img" aria-labelledby="kairo-fig-title kairo-fig-desc">
  <title id="kairo-fig-title">Kairo core loop: data flow</title>
  <desc id="kairo-fig-desc">The AI reads the requirements document into a WBS; MCP/CLI build the task tree and KairoCore schedules it. Status flows back through MCP/CLI to the AI, which builds feature by feature while the human reviews in the macOS app.</desc>
  <style>
    .canvas { fill: #FFFFFF; }
    .panel { fill: #FFFFFF; stroke: #D8DAE0; stroke-width: 1; }
    .soft { fill: #F6F7F9; stroke: #D8DAE0; stroke-width: 1; }
    .accent { fill: #EEF0FE; stroke: #5F6CF8; stroke-width: 1; }
    .core { fill: #F4EEFC; stroke: #A13EF2; stroke-width: 1; }
    .line { stroke: #7A8290; stroke-width: 1.3; fill: none; }
    .tree { stroke: #C3C7D0; stroke-width: 1; fill: none; }
    .t-title { font: 600 13px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #1C1C1E; }
    .t-sub { font: 400 12px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; }
    .t-name { font: 600 12.5px "SF Mono", ui-monospace, Menlo, monospace; fill: #1C1C1E; }
    .t-mono { font: 400 12px "SF Mono", ui-monospace, Menlo, monospace; fill: #1C1C1E; }
    .t-band { font: 600 11px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; letter-spacing: 0.4px; }
    .t-note { font: 400 10.5px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; }
    .arrow-head { fill: #7A8290; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1C1C1E; }
      .panel { fill: #2C2C2E; stroke: #3A3A3C; }
      .soft { fill: #242426; stroke: #3A3A3C; }
      .accent { fill: #232640; stroke: #5F6CF8; }
      .core { fill: #2B2233; stroke: #A13EF2; }
      .line { stroke: #8B93A3; }
      .tree { stroke: #4A4A4E; }
      .t-title, .t-name, .t-mono { fill: #F2F2F7; }
      .t-sub, .t-band, .t-note { fill: #A6A6AD; }
      .arrow-head { fill: #8B93A3; }
    }
  </style>
  <defs>
    <marker id="kairo-arrow" markerWidth="8" markerHeight="8" refX="7.2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrow-head"/>
    </marker>
  </defs>
  <rect class="canvas" x="0" y="0" width="880" height="320"/>
  <rect class="panel" x="40" y="44" width="150" height="56" rx="8"/>
  <text class="t-title" x="115" y="77" text-anchor="middle">Requirements</text>
  <rect class="panel" x="290" y="44" width="150" height="56" rx="8"/>
  <text class="t-title" x="365" y="77" text-anchor="middle">WBS breakdown</text>
  <rect class="core" x="610" y="44" width="210" height="56" rx="8"/>
  <text class="t-title" x="715" y="77" text-anchor="middle">KairoCore scheduling</text>
  <path class="line" d="M190,72 L290,72" marker-end="url(#kairo-arrow)"/>
  <text class="t-sub" x="240" y="62" text-anchor="middle">read by AI</text>
  <path class="line" d="M440,72 L610,72" marker-end="url(#kairo-arrow)"/>
  <text class="t-sub" x="525" y="62" text-anchor="middle">(MCP/CLI: build task tree)</text>
  <rect class="accent" x="330" y="142" width="170" height="52" rx="8"/>
  <text class="t-title" x="415" y="174" text-anchor="middle">AI implements</text>
  <path class="line" d="M715,100 L715,168 L500,168" marker-end="url(#kairo-arrow)"/>
  <path class="line" d="M330,168 L115,168 L115,100" marker-end="url(#kairo-arrow)"/>
  <text class="t-sub" x="222" y="158" text-anchor="middle">(MCP/CLI: status write-back)</text>
  <rect class="soft" x="265" y="246" width="300" height="50" rx="8"/>
  <text class="t-title" x="415" y="276" text-anchor="middle">Human reviews / intervenes in the app</text>
  <path class="line" d="M415,246 L415,194" marker-end="url(#kairo-arrow)"/>
  <text class="t-note" x="20" y="310">Solid lines are automatic; MCP/CLI carry the status write-back, closing the loop requirements → plan → build → write-back.</text>
</svg>
