  <path class="tree" d="M74,263 L86,263"/>
  <text class="t-name" x="92" y="277">Sources/</text>
  <text class="t-sub" x="168.8" y="277"># ContentView / 甘特 / 命令面板 / zeno:// 深链</text>
  <path class="tree" d="M74,282 L86,282"/>
  <text class="t-name" x="92" y="296">Resources/</text>
  <path class="tree" d="M38,301 L50,301"/>
  <text class="t-name" x="56" y="315">Interfaces/</text>
  <path class="tree" d="M56,323 L68,323"/>
  <text class="t-name" x="74" y="337">mcp/</text>
  <text class="t-sub" x="120.4" y="337"># MCP 服务（复用 ZenoCore）</text>
  <path class="tree" d="M56,342 L68,342"/>
  <text class="t-name" x="74" y="356">cli/</text>
  <text class="t-sub" x="120.4" y="356"># CLI（复用 ZenoCore；从 MCP 契约派生命令）</text>
  <path class="tree" d="M38,361 L50,361"/>
  <text class="t-name" x="56" y="375">Plugins/</text>
