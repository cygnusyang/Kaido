  <text class="t-name" x="56" y="94">Package.swift</text>
  <text class="t-sub" x="170.79999999999998" y="94"># SwiftPM 根清单（core + 各产品 target 同仓）</text>
  <path class="tree" d="M38,99 L50,99"/>
  <text class="t-name" x="56" y="113">Sources/</text>
  <path class="tree" d="M56,121 L68,121"/>
