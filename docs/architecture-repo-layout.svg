<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 518" width="920" height="518"
     role="img" aria-labelledby="kairo-fig-title kairo-fig-desc">
  <title id="kairo-fig-title">Kairo repository layout</title>
  <desc id="kairo-fig-desc">Monorepo: Package.swift at the root, Sources for the cross-platform core, Apps/macOS for the app, Interfaces (MCP / CLI), Plugins/claude-code, Tests and docs.</desc>
  <style>
    .canvas { fill: #FFFFFF; }
    .panel { fill: #FFFFFF; stroke: #D8DAE0; stroke-width: 1; }
    .soft { fill: #F6F7F9; stroke: #D8DAE0; stroke-width: 1; }
    .accent { fill: #EEF0FE; stroke: #5F6CF8; stroke-width: 1; }
    .core { fill: #F4EEFC; stroke: #A13EF2; stroke-width: 1; }
    .line { stroke: #7A8290; stroke-width: 1.3; fill: none; }
    .tree { stroke: #C3C7D0; stroke-width: 1; fill: none; }
    .t-title { font: 600 13px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #1C1C1E; }
    .t-sub { font: 400 12px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; }
    .t-name { font: 600 12.5px "SF Mono", ui-monospace, Menlo, monospace; fill: #1C1C1E; }
    .t-mono { font: 400 12px "SF Mono", ui-monospace, Menlo, monospace; fill: #1C1C1E; }
    .t-band { font: 600 11px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; letter-spacing: 0.4px; }
    .t-note { font: 400 10.5px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; }
    .arrow-head { fill: #7A8290; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1C1C1E; }
      .panel { fill: #2C2C2E; stroke: #3A3A3C; }
      .soft { fill: #242426; stroke: #3A3A3C; }
      .accent { fill: #232640; stroke: #5F6CF8; }
      .core { fill: #2B2233; stroke: #A13EF2; }
      .line { stroke: #8B93A3; }
      .tree { stroke: #4A4A4E; }
      .t-title, .t-name, .t-mono { fill: #F2F2F7; }
      .t-sub, .t-band, .t-note { fill: #A6A6AD; }
      .arrow-head { fill: #8B93A3; }
    }
  </style>
  <defs>
    <marker id="kairo-arrow" markerWidth="8" markerHeight="8" refX="7.2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrow-head"/>
    </marker>
  </defs>
  <rect class="canvas" x="0" y="0" width="920" height="518"/>
  <rect class="accent" x="24" y="24" width="110" height="34" rx="8"/>
  <text class="t-title" x="79.0" y="47" text-anchor="middle">Kairo/</text>
  <path class="tree" d="M38,80 L50,80"/>
  <text class="t-name" x="56" y="94">Package.swift</text>
  <text class="t-sub" x="170.79999999999998" y="94"># SwiftPM manifest (core and product targets in one repo)</text>
  <path class="tree" d="M38,99 L50,99"/>
  <text class="t-name" x="56" y="113">Sources/</text>
  <path class="tree" d="M56,121 L68,121"/>
  <text class="t-name" x="74" y="135">KairoCore/</text>
  <text class="t-sub" x="166.0" y="135"># cross-platform core (pure logic; no AppKit/SwiftUI import)</text>
  <path class="tree" d="M74,143 L86,143"/>
  <text class="t-name" x="92" y="157">Model/</text>
  <text class="t-sub" x="153.6" y="157"># Task/TaskDependency/Resource/WorkCalendar/Project/ProjectSettings</text>
  <path class="tree" d="M74,162 L86,162"/>
  <text class="t-name" x="92" y="176">Schedule/</text>
  <text class="t-sub" x="176.4" y="176"># scheduler (dependency propagation, critical path, slack, violations)</text>
  <path class="tree" d="M74,181 L86,181"/>
  <text class="t-name" x="92" y="195">Storage/</text>
  <text class="t-sub" x="168.8" y="195"># .kairo codec / templates / import and export</text>
  <path class="tree" d="M74,200 L86,200"/>
  <text class="t-name" x="92" y="214">Query/</text>
  <text class="t-sub" x="153.6" y="214"># AIFilter migration + query/filter interfaces</text>
  <path class="tree" d="M38,219 L50,219"/>
  <text class="t-name" x="56" y="233">Apps/</text>
  <path class="tree" d="M56,241 L68,241"/>
  <text class="t-name" x="74" y="255">macos/</text>
  <text class="t-sub" x="135.6" y="255"># macOS SwiftUI app (imports KairoCore)</text>
  <path class="tree" d="M74,263 L86,263"/>
  <text class="t-name" x="92" y="277">Sources/</text>
  <text class="t-sub" x="168.8" y="277"># ContentView / Gantt / command palette / kairo:// deep links</text>
  <path class="tree" d="M74,282 L86,282"/>
  <text class="t-name" x="92" y="296">Resources/</text>
  <path class="tree" d="M38,301 L50,301"/>
  <text class="t-name" x="56" y="315">Interfaces/</text>
  <path class="tree" d="M56,323 L68,323"/>
  <text class="t-name" x="74" y="337">mcp/</text>
  <text class="t-sub" x="120.4" y="337"># MCP server (reuses KairoCore)</text>
  <path class="tree" d="M56,342 L68,342"/>
  <text class="t-name" x="74" y="356">cli/</text>
  <text class="t-sub" x="120.4" y="356"># CLI (reuses KairoCore; commands derived from the MCP contract)</text>
  <path class="tree" d="M38,361 L50,361"/>
  <text class="t-name" x="56" y="375">Plugins/</text>
  <path class="tree" d="M56,383 L68,383"/>
  <text class="t-name" x="74" y="397">claude-code/</text>
  <text class="t-sub" x="181.2" y="397"># slash commands + hooks + .mcp.json template</text>
  <path class="tree" d="M38,402 L50,402"/>
  <text class="t-name" x="56" y="416">Tests/</text>
  <path class="tree" d="M56,424 L68,424"/>
  <text class="t-name" x="74" y="438">KairoCoreTests/</text>
  <text class="t-sub" x="203.99999999999997" y="438"># full core unit tests (also build on Linux)</text>
  <path class="tree" d="M56,443 L68,443"/>
  <text class="t-name" x="74" y="457">AppTests/</text>
  <text class="t-sub" x="158.4" y="457"># app-layer tests (store interaction + offscreen ImageRenderer)</text>
  <path class="tree" d="M56,462 L68,462"/>
  <text class="t-name" x="74" y="476">InterfaceTests/</text>
  <text class="t-sub" x="203.99999999999997" y="476"># MCP/CLI parity contract tests (US-E5-05)</text>
  <path class="tree" d="M38,481 L50,481"/>
  <text class="t-name" x="56" y="495">docs/</text>
  <text class="t-sub" x="110.0" y="495"># this documentation set (00-vision / 01-prd / 02-architecture / 03-roadmap / features)</text>
  <path class="tree" d="M38,58 L38,80"/>
  <path class="tree" d="M56,121 L56,121"/>
  <path class="tree" d="M74,143 L74,200"/>
  <path class="tree" d="M56,241 L56,241"/>
  <path class="tree" d="M74,263 L74,282"/>
  <path class="tree" d="M56,323 L56,342"/>
  <path class="tree" d="M56,383 L56,383"/>
  <path class="tree" d="M56,424 L56,462"/>
  <text class="t-note" x="20" y="512">Boundary rule: KairoCore never depends on an interface layer or UI; interface layers may only use the public KairoCore API.</text>
</svg>
