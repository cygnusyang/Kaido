<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" role="img" aria-labelledby="title desc">
  <title id="title">Zeno 分工闭环</title>
  <desc id="desc">需求文档经 AI 读取后分解为 WBS，由 Zeno 排期管理，再由 AI 逐功能开发，完成后回写状态形成闭环。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .box-zeno { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.8; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 14px; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .edge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; fill: #64748b; text-anchor: middle; }
      .line { stroke: #64748b; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <!-- Nodes -->
  <rect class="box" x="24" y="36" width="120" height="48" rx="10"/>
  <text class="label" x="84" y="60">需求文档</text>

  <rect class="box" x="236" y="36" width="120" height="48" rx="10"/>
  <text class="label" x="296" y="60">WBS 分解</text>

  <rect class="box-zeno" x="448" y="36" width="140" height="48" rx="10"/>
  <text class="label" x="518" y="60">Zeno 排期管理</text>

  <rect class="box" x="700" y="36" width="140" height="48" rx="10"/>
  <text class="label" x="770" y="60">AI 逐功能开发</text>

  <!-- Forward edges -->
  <path class="line" d="M 144 60 H 228"/>
  <text class="edge" x="186" y="48">AI 读取</text>

  <path class="line" d="M 356 60 H 440"/>

  <path class="line" d="M 588 60 H 692"/>

  <!-- Feedback loop -->
  <path class="line" d="M 770 84 V 148 H 84 V 92"/>
  <text class="edge" x="427" y="168">AI 每完成一个功能，回写状态</text>
</svg>
