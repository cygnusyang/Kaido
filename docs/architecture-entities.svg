<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 597" width="920" height="597"
     role="img" aria-labelledby="kairo-fig-title kairo-fig-desc">
  <title id="kairo-fig-title">Kairo project entity relations</title>
  <desc id="kairo-fig-desc">Project aggregates settings, tasks, dependencies, resources, assignments, work calendar, baselines, change history and metadata; Task, TaskDependency, Resource and TaskAssignment are expanded field by field.</desc>
  <style>
    .canvas { fill: #FFFFFF; }
    .panel { fill: #FFFFFF; stroke: #D8DAE0; stroke-width: 1; }
    .soft { fill: #F6F7F9; stroke: #D8DAE0; stroke-width: 1; }
    .accent { fill: #EEF0FE; stroke: #5F6CF8; stroke-width: 1; }
    .core { fill: #F4EEFC; stroke: #A13EF2; stroke-width: 1; }
    .line { stroke: #7A8290; stroke-width: 1.3; fill: none; }
    .tree { stroke: #C3C7D0; stroke-width: 1; fill: none; }
    .t-title { font: 600 13px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #1C1C1E; }
    .t-sub { font: 400 12px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; }
    .t-name { font: 600 12.5px "SF Mono", ui-monospace, Menlo, monospace; fill: #1C1C1E; }
    .t-mono { font: 400 12px "SF Mono", ui-monospace, Menlo, monospace; fill: #1C1C1E; }
    .t-band { font: 600 11px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; letter-spacing: 0.4px; }
    .t-note { font: 400 10.5px "SF Pro Text", -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #5C6169; }
    .arrow-head { fill: #7A8290; }
    @media (prefers-color-scheme: dark) {
      .canvas { fill: #1C1C1E; }
      .panel { fill: #2C2C2E; stroke: #3A3A3C; }
      .soft { fill: #242426; stroke: #3A3A3C; }
      .accent { fill: #232640; stroke: #5F6CF8; }
      .core { fill: #2B2233; stroke: #A13EF2; }
      .line { stroke: #8B93A3; }
      .tree { stroke: #4A4A4E; }
      .t-title, .t-name, .t-mono { fill: #F2F2F7; }
      .t-sub, .t-band, .t-note { fill: #A6A6AD; }
      .arrow-head { fill: #8B93A3; }
    }
  </style>
  <defs>
    <marker id="kairo-arrow" markerWidth="8" markerHeight="8" refX="7.2" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" class="arrow-head"/>
    </marker>
  </defs>
  <rect class="canvas" x="0" y="0" width="920" height="597"/>
  <rect class="accent" x="24" y="26" width="120" height="34" rx="8"/>
  <text class="t-title" x="84.0" y="49" text-anchor="middle">Project</text>
  <path class="tree" d="M38,60 L38,86"/>
  <path class="tree" d="M38,86 L38,541"/>
  <path class="tree" d="M38,86 L50,86"/>
  <text class="t-name" x="56" y="90">settings</text>
  <text class="t-mono" x="128.8" y="90">: ProjectSettings</text>
  <text class="t-sub" x="78" y="107">direction, schedulePrecision, dateMode,</text>
  <text class="t-sub" x="78" y="124">granularity, projectStartDate/EndDate, workWeek</text>
  <path class="tree" d="M38,145 L50,145"/>
  <text class="t-name" x="56" y="149">tasks</text>
  <text class="t-mono" x="106.0" y="149">: [Task]</text>
  <text class="t-sub" x="78" y="166">Task: id, title, notes, kind(task|group|milestone|hammock), parentID?</text>
  <text class="t-sub" x="78" y="183">startDate, dueDate, duration, effort, progress, status,</text>
  <text class="t-sub" x="78" y="200">priority, tags, constraints(4 nullable constraint dates),</text>
  <text class="t-sub" x="78" y="217">baselineStart/baselineEnd, customValues</text>
  <path class="tree" d="M38,238 L50,238"/>
  <text class="t-name" x="56" y="242">dependencies</text>
  <text class="t-mono" x="159.2" y="242">: [TaskDependency]</text>
  <text class="t-sub" x="78" y="259">TaskDependency: predecessorID, type(FS|FF|SS|SF),</text>
  <text class="t-sub" x="78" y="276">lag { amount, unit: working|elapsed|percentage }</text>
  <path class="tree" d="M38,297 L50,297"/>
  <text class="t-name" x="56" y="301">resources</text>
  <text class="t-mono" x="136.4" y="301">: [Resource]</text>
  <text class="t-sub" x="78" y="318">Resource: id, name, email, type(person|equipment|material|group),</text>
  <text class="t-sub" x="78" y="335">units, efficiency, costPerUse, costPerHour,</text>
  <text class="t-sub" x="78" y="352">availabilityStart/End, parentID?, calendar?</text>
  <path class="tree" d="M38,373 L50,373"/>
  <text class="t-name" x="56" y="377">assignments</text>
  <text class="t-mono" x="151.6" y="377">: [TaskAssignment]</text>
  <text class="t-sub" x="78" y="394">TaskAssignment: taskID, resourceID, units</text>
  <path class="tree" d="M38,415 L50,415"/>
  <text class="t-name" x="56" y="419">calendar</text>
  <text class="t-mono" x="128.8" y="419">: WorkCalendar</text>
  <text class="t-sub" x="78" y="436">weeklyBlocks + exceptions</text>
  <path class="tree" d="M38,457 L50,457"/>
  <text class="t-name" x="56" y="461">baselines</text>
  <text class="t-mono" x="136.4" y="461">: [Baseline]</text>
  <text class="t-sub" x="78" y="478">snapshot name + time + task dates/progress</text>
  <path class="tree" d="M38,499 L50,499"/>
  <text class="t-name" x="56" y="503">history</text>
  <text class="t-mono" x="121.2" y="503">: [ChangeRecord]</text>
  <text class="t-sub" x="78" y="520">field path + old value + new value + time + source</text>
  <path class="tree" d="M38,541 L50,541"/>
  <text class="t-name" x="56" y="545">metadata</text>
  <text class="t-sub" x="78" y="562">title, fileVersion, createdAt, updatedAt</text>
  <text class="t-note" x="20" y="591">Field-level draft: Task / TaskDependency / Resource / TaskAssignment are expanded to fields; the other aggregates state their shape only.</text>
</svg>
